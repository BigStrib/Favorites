<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Favorite Places</title>
    <link rel="stylesheet" href="styles.css">
	<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body>

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
                <h1>Favorite Places</h1>
                <p class="login-sub">Sign in to access your bookmarks</p>
            </div>
            <form id="loginForm">
                <div class="login-field">
                    <div class="field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <input type="text" id="loginUser" placeholder="Username" required autocomplete="username" spellcheck="false">
                </div>
                <div class="login-field">
                    <div class="field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <input type="password" id="loginPass" placeholder="Password" required autocomplete="current-password">
                    <button type="button" id="togglePass" class="toggle-pass" tabindex="-1" title="Show password">
                        <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="eyeShut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <div id="loginError" class="login-error"></div>
                <button type="submit" id="loginBtn" class="btn primary login-submit">
                    <span id="loginBtnText">Sign In</span>
                    <svg id="loginSpinner" class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18" style="display:none">
                        <circle cx="12" cy="12" r="10" stroke-dasharray="30 70" stroke-linecap="round"></circle>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP (hidden until login) -->
    <div id="app" class="app hidden">
        <div class="top-bar">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search..." autocomplete="off" spellcheck="false">
                <button id="clearSearch" class="clear-btn">&times;</button>
            </div>
            <button id="addBtn" class="icon-btn add" title="Add bookmark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <button id="addFolderBtn" class="icon-btn folder" title="New folder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    <line x1="12" y1="11" x2="12" y2="17"></line>
                    <line x1="9" y1="14" x2="15" y2="14"></line>
                </svg>
            </button>
            <button id="logoutBtn" class="icon-btn logout" title="Sign out">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>

        <div id="dropZone" class="drop-zone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="36" height="36">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Drop links here</span>
        </div>

        <ul id="tree" class="tree"></ul>

        <div id="empty" class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" width="48" height="48">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            <p>No bookmarks yet</p>
        </div>

        <div id="rootDrop" class="root-drop" style="display:none;">
            <span>Drop here to move to root</span>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-head">
                <span id="modalTitle">Add Bookmark</span>
                <button id="modalClose" class="modal-x">&times;</button>
            </div>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                <input type="hidden" id="itemType" value="bookmark">
                <input type="text" id="itemName" placeholder="Name" required>
                <input type="text" id="itemUrl" placeholder="URL (e.g. google.com)">
                <select id="itemParent"><option value="">— Root —</option></select>
                <div class="modal-foot">
                    <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
                    <button type="submit" class="btn primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal modal-confirm">
            <div class="modal-head">
                <span id="confirmTitle">Confirm</span>
            </div>
            <p id="confirmMsg" class="confirm-msg"></p>
            <div class="modal-foot confirm-foot">
                <button id="confirmNo" class="btn ghost">Cancel</button>
                <button id="confirmYes" class="btn danger-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="ctx" class="ctx">
        <button data-action="edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Edit
        </button>
        <button data-action="move">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
            Move to…
        </button>
        <div class="ctx-div"></div>
        <button data-action="delete" class="danger">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Delete
        </button>
    </div>

    <!-- Move Modal -->
    <div id="moveModal" class="modal-overlay">
        <div class="modal modal-sm">
            <div class="modal-head">
                <span>Move to</span>
                <button id="moveClose" class="modal-x">&times;</button>
            </div>
            <div id="moveList" class="move-list"></div>
        </div>
    </div>

    <!-- Logout Confirm -->
    <div id="logoutModal" class="modal-overlay">
        <div class="modal modal-confirm">
            <div class="modal-head">
                <span>Sign Out</span>
            </div>
            <p class="confirm-msg">Are you sure you want to sign out?</p>
            <div class="modal-foot confirm-foot">
                <button id="logoutNo" class="btn ghost">Cancel</button>
                <button id="logoutYes" class="btn danger-btn">Sign Out</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
